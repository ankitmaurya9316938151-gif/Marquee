<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>website</title>
</head>
<style>
    *{
        box-sizing: border-box;
        margin: 0;
    }
    header {
        
        width: 100%;
        position: fixed;
        top: 0;
        background-color: brown;
        padding: 10px ;
    }
   
    nav ul {
       
        display: flex;
        justify-content: space-between;
        
        
    }
    nav ul li {
      justify-content: space-between;
        margin: 0 15px;
    }
    nav ul li a{
          
        color: white;
        text-decoration: none;
        font-size: 18px;
    }
    main {
       
padding: auto;
            margin-top: 60px; 
            height: 400px;
            display: flex;
      justify-content: center;
        align-items: center;
    }
    footer {
        background-color:gray;
        color: white;
        text-align: center;
        padding: 10px 0;
        position: fixed;
        width: 100%;
        bottom: 0;
    }
 
</style>
<body>
    <header>
    <nav>
        <ul>
            <li><a href="#home">home</a></li>
            <li><a href="#blog">blog</a></li>
            <li><a href="#about">about</a></li>
            <li><a href="#contact">contact</a></li>
        </ul>
    </nav>
    </header>
    <main>
        <section id="home">
         <h2>welcome to my website</h2>
         <span>thankyou for visiting!</span>
        </section>
    </main>
    <footer>
        <div>
            <p>Copyright &copy; 2024 My Website. All rights reserved.</p>
        </div>
    </footer>

</html>
